<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏯 한국사 시간탐험대</title>
<script src="shared.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0a0814; font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif; overflow:hidden; width:100vw; height:100vh; display:flex; align-items:center; justify-content:center; }
#gameCanvas { display:block; max-width:100vw; max-height:100vh; }
#ui { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; }
#hud { position:fixed; top:18px; left:50%; transform:translateX(-50%); display:flex; gap:28px; align-items:center; pointer-events:none; }
.hud-box { background:rgba(0,0,0,0.55); border:1.5px solid rgba(255,220,100,0.35); border-radius:12px; padding:7px 18px; color:#ffe680; font-size:0.95rem; font-weight:700; letter-spacing:1px; backdrop-filter:blur(6px); }
.hud-box span { color:#fff; font-size:1.05rem; }
#lives { display:flex; gap:4px; }
.heart { font-size:1.3rem; }
/* 화면들 */
.screen { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:rgba(8,6,20,0.96); z-index:100; }
.screen.hidden { display:none; }
.title-glow { font-size:2.8rem; font-weight:900; background:linear-gradient(135deg,#ffe680,#ff9d00,#ff4e50); -webkit-background-clip:text; -webkit-text-fill-color:transparent; filter:drop-shadow(0 0 20px rgba(255,180,0,0.5)); text-align:center; }
.subtitle { color:#8892b0; font-size:1rem; margin-top:8px; letter-spacing:2px; }
.era-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:36px; max-width:700px; width:90%; }
.era-btn { background:rgba(255,255,255,0.04); border:1.5px solid rgba(255,220,100,0.2); border-radius:16px; padding:20px 14px; cursor:pointer; transition:all .25s; text-align:center; pointer-events:all; }
.era-btn:hover { transform:translateY(-4px); border-color:rgba(255,220,100,0.6); background:rgba(255,220,100,0.08); box-shadow:0 0 20px rgba(255,180,0,0.2); }
.era-icon { font-size:2.2rem; }
.era-name { color:#ffe680; font-size:0.85rem; font-weight:700; margin-top:8px; }
.era-range { color:#556; font-size:0.72rem; margin-top:3px; }
#profile-badge { font-size:13px; color:#88ccff; margin-top:14px; text-align:center; pointer-events:none; }
#profile-badge b { color:#ffe680; }
.review-tag-h { display:inline-block; margin-left:8px; font-size:11px; color:#ffd166; background:rgba(255,209,102,0.15); border:1px solid rgba(255,209,102,0.4); border-radius:8px; padding:2px 8px; }
.level-msg-h { font-size:0.95rem; font-weight:700; margin-top:10px; }
.level-msg-h.up { color:#88ff88; }
.level-msg-h.down { color:#ffaa88; }
.big-btn { pointer-events:all; cursor:pointer; margin-top:24px; padding:14px 44px; border-radius:50px; border:none; font-size:1.05rem; font-weight:800; letter-spacing:1px; transition:all .2s; }
.btn-gold { background:linear-gradient(135deg,#ffe680,#ff9d00); color:#1a0a00; }
.btn-gold:hover { transform:scale(1.05); box-shadow:0 0 24px rgba(255,180,0,0.5); }
.btn-back { background:rgba(255,255,255,0.08); color:#8892b0; border:1px solid rgba(255,255,255,0.15); }
.btn-back:hover { background:rgba(255,255,255,0.12); }
/* 퀴즈 UI */
#quiz-screen { background:transparent; z-index:50; justify-content:flex-end; padding-bottom:32px; }
#question-box { max-width:720px; width:92%; background:rgba(8,6,20,0.88); border:1.5px solid rgba(255,220,100,0.3); border-radius:20px; padding:26px 28px 20px; backdrop-filter:blur(14px); pointer-events:all; }
#q-era-badge { display:inline-block; font-size:0.72rem; font-weight:700; letter-spacing:1.5px; color:#ff9d00; border:1px solid #ff9d00; border-radius:100px; padding:3px 12px; margin-bottom:12px; }
#q-text { color:#f0f4ff; font-size:1.15rem; font-weight:700; line-height:1.6; margin-bottom:18px; }
#choices { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.choice-btn { background:rgba(255,255,255,0.05); border:1.5px solid rgba(255,255,255,0.12); border-radius:12px; padding:13px 16px; color:#c9d1e0; font-size:0.92rem; cursor:pointer; transition:all .18s; text-align:left; pointer-events:all; }
.choice-btn:hover:not(:disabled) { background:rgba(255,220,100,0.1); border-color:rgba(255,220,100,0.5); color:#ffe680; }
.choice-btn.correct { background:rgba(50,220,100,0.2)!important; border-color:#32dc64!important; color:#32dc64!important; }
.choice-btn.wrong { background:rgba(255,60,60,0.2)!important; border-color:#ff3c3c!important; color:#ff3c3c!important; }
.choice-btn:disabled { cursor:default; }
#timer-bar-wrap { height:5px; background:rgba(255,255,255,0.08); border-radius:3px; margin-bottom:14px; overflow:hidden; }
#timer-bar { height:100%; border-radius:3px; transition:width .1s linear; background:linear-gradient(90deg,#ffe680,#ff9d00); }
/* 결과 */
#result-screen .score-big { font-size:4rem; font-weight:900; color:#ffe680; text-shadow:0 0 30px rgba(255,180,0,0.6); }
#result-screen .grade { font-size:1.4rem; color:#ff9d00; margin:8px 0 4px; }
#result-screen .result-detail { color:#8892b0; font-size:0.95rem; margin-top:6px; }
#combo-popup { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); font-size:2rem; font-weight:900; color:#ffe680; text-shadow:0 0 20px #ff9d00; pointer-events:none; opacity:0; z-index:200; transition:all .3s; }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<!-- HUD -->
<div id="hud" style="display:none">
  <div class="hud-box">점수 <span id="score-display">0</span></div>
  <div class="hud-box" id="lives">
    <span class="heart">❤️</span><span class="heart">❤️</span><span class="heart">❤️</span>
  </div>
  <div class="hud-box">콤보 <span id="combo-display">0</span>🔥</div>
</div>

<!-- 시작 화면 -->
<div class="screen" id="start-screen">
  <div class="title-glow">🏯 한국사 시간탐험대</div>
  <div class="subtitle">초등 6학년 · 시대를 넘나드는 역사 퀴즈</div>
  <div id="profile-badge"></div>
  <div class="era-grid">
    <div class="era-btn" onclick="startEra(0)">
      <div class="era-icon">🏺</div>
      <div class="era-name">고조선·여러 나라</div>
      <div class="era-range">BC 2333 ~ AD 300</div>
    </div>
    <div class="era-btn" onclick="startEra(1)">
      <div class="era-icon">⚔️</div>
      <div class="era-name">삼국시대</div>
      <div class="era-range">AD 57 ~ 676</div>
    </div>
    <div class="era-btn" onclick="startEra(2)">
      <div class="era-icon">📜</div>
      <div class="era-name">고려시대</div>
      <div class="era-range">918 ~ 1392</div>
    </div>
    <div class="era-btn" onclick="startEra(3)">
      <div class="era-icon">👘</div>
      <div class="era-name">조선시대</div>
      <div class="era-range">1392 ~ 1897</div>
    </div>
    <div class="era-btn" onclick="startEra(4)">
      <div class="era-icon">🏮</div>
      <div class="era-name">근대·개화기</div>
      <div class="era-range">1863 ~ 1919</div>
    </div>
    <div class="era-btn" onclick="startEra(5)">
      <div class="era-icon">🕊️</div>
      <div class="era-name">일제강점·광복</div>
      <div class="era-range">1910 ~ 1948</div>
    </div>
  </div>
  <button class="big-btn btn-gold" onclick="startEra(-1)">🎲 전 시대 도전!</button>
</div>

<!-- 퀴즈 화면 -->
<div class="screen hidden" id="quiz-screen">
  <div id="question-box">
    <div id="q-era-badge">고조선</div>
    <div id="timer-bar-wrap"><div id="timer-bar" style="width:100%"></div></div>
    <div id="q-text">문제가 여기에 표시됩니다.</div>
    <div id="choices"></div>
  </div>
</div>

<!-- 결과 화면 -->
<div class="screen hidden" id="result-screen">
  <div class="title-glow" id="result-era-name"></div>
  <div class="score-big" id="final-score">0점</div>
  <div class="grade" id="final-grade"></div>
  <div class="result-detail" id="result-detail"></div>
  <div class="level-msg-h" id="level-msg-h"></div>
  <div style="display:flex;gap:14px;margin-top:28px">
    <button class="big-btn btn-gold" onclick="retryEra()">다시 도전</button>
    <button class="big-btn btn-back" onclick="goHome()">시대 선택</button>
  </div>
</div>

<div id="combo-popup"></div>

  { era:5, q:'광복 후 미국과 소련이 한반도를 분단한 기준선은?', a:'38선', w:['휴전선','두만강','청천강'] },
  { era:5, q:'대한민국 정부가 수립된 해는?', a:'1948년', w:['1945년','1950년','1919년'] },
  { era:5, q:'일제가 우리말과 이름을 못 쓰게 한 정책은?', a:'민족 말살 정책', w:['토지 조사 사업','헌병 경찰 통치','문화 통치'] },
  { era:5, q:'안중근 의사가 이토 히로부미를 저격한 곳은?', a:'하얼빈(중국)', w:['상하이','도쿄','블라디보스토크'] },
];

// ─── 게임 상태 ─────────────────────────────────────────────────
let state = { era:-1, questions:[], idx:0, score:0, lives:3, combo:0, timer:0, timerMax:20, timerInterval:null, answered:false, totalAnswered:0, totalCorrect:0 };

// ─── Canvas 배경 ────────────────────────────────────────────────
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
let particles = [];
let bgColor = '#0a0814';

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function spawnParticles(x, y, color, n=16) {
  for (let i=0; i<n; i++) {
    const angle = (Math.PI*2/n)*i + Math.random()*0.3;
    const speed = 2 + Math.random()*4;
    particles.push({ x, y, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed-2, alpha:1, color, size:3+Math.random()*4 });
  }
}

function drawBg() {
  ctx.fillStyle = bgColor;
  ctx.fillRect(0,0,canvas.width,canvas.height);
  // 별
  ctx.fillStyle = 'rgba(255,255,200,0.5)';
  for (let i=0; i<80; i++) {
    const x = ((i*137.5)%1)*(canvas.width);
    const y = ((i*97.3)%1)*(canvas.height);
    const s = 0.5+((i*57)%3)*0.5;
    ctx.beginPath(); ctx.arc(x,y,s,0,Math.PI*2); ctx.fill();
  }
}

function animLoop() {
  drawBg();
  particles = particles.filter(p=>p.alpha>0.02);
  particles.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.12; p.alpha*=0.94;
    ctx.globalAlpha=p.alpha;
    ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
    ctx.globalAlpha=1;
  });
  requestAnimationFrame(animLoop);
}
animLoop();

// ─── 오디오 ─────────────────────────────────────────────────────
const AC = new (window.AudioContext||window.webkitAudioContext)();
function beep(freq,dur,type='square',vol=0.15) {
  try {
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(vol,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime+dur);
  } catch(e){}
}
function playCorrect() { beep(660,0.1,'sine',0.2); setTimeout(()=>beep(880,0.15,'sine',0.2),80); setTimeout(()=>beep(1100,0.2,'sine',0.15),160); }
function playWrong()   { beep(220,0.15,'sawtooth',0.2); setTimeout(()=>beep(180,0.25,'sawtooth',0.15),100); }
function playCombo()   { [660,770,880,990,1100].forEach((f,i)=>setTimeout(()=>beep(f,0.1,'sine',0.25),i*60)); }

// ─── 화면 전환 ───────────────────────────────────────────────────
function show(id) {
  ['start-screen','quiz-screen','result-screen'].forEach(s=>{
    document.getElementById(s).classList.toggle('hidden', s!==id);
  });
  document.getElementById('hud').style.display = id==='quiz-screen' ? 'flex' : 'none';
}

// ─── 게임 시작 ───────────────────────────────────────────────────
function startEra(eraIdx) {
  if(AC.state==='suspended') AC.resume();
  state.era = eraIdx;
  let pool = eraIdx===-1 ? [...QUESTIONS] : QUESTIONS.filter(q=>q.era===eraIdx);
  // 섞기
  for(let i=pool.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
  let selected = pool.slice(0, eraIdx===-1 ? 20 : 8);

  // 학습허브: 오답노트 복습문제 주입 (최대 3개)
  if(typeof LearningHub!=='undefined' && LearningHub.getCurrentUser()){
    const review = LearningHub.getReviewQueue('한국사탐험','사회',3)
      .filter(rq => eraIdx===-1 || rq.era===eraIdx);
    review.forEach(rq=>{
      const match = QUESTIONS.find(item=>item.q===rq.q);
      if(match){
        selected = selected.filter(item=>item.q!==match.q);
        selected.splice(Math.min(1,selected.length), 0, match);
      }
    });
    selected = selected.slice(0, eraIdx===-1 ? 20 : 8);
  }

  state.questions = selected;
  state.idx=0; state.score=0; state.lives=3; state.combo=0; state.totalAnswered=0; state.totalCorrect=0;
  updateHUD();
  bgColor = eraIdx===-1 ? '#0a0814' : ERAS[eraIdx].bg;
  show('quiz-screen');
  loadQuestion();
}

function loadQuestion() {
  if(state.idx >= state.questions.length) { endGame(); return; }
  state.answered = false;
  const q = state.questions[state.idx];
  const era = ERAS[q.era];
  document.getElementById('q-era-badge').textContent = era.name;
  document.getElementById('q-era-badge').style.color = era.color;
  document.getElementById('q-era-badge').style.borderColor = era.color;
  document.getElementById('q-text').textContent = q.q;

  const choices = shuffle([q.a, ...q.w]);
  const div = document.getElementById('choices');
  div.innerHTML = '';
  choices.forEach(c=>{
    const btn = document.createElement('button');
    btn.className='choice-btn';
    btn.textContent=c;
    btn.onclick=()=>answer(btn, c, q.a);
    div.appendChild(btn);
  });

  state.timerMax = 20;
  state.timer = state.timerMax;
  clearInterval(state.timerInterval);
  state.timerInterval = setInterval(()=>{
    state.timer -= 0.1;
    const pct = Math.max(0, state.timer/state.timerMax*100);
    document.getElementById('timer-bar').style.width = pct+'%';
    document.getElementById('timer-bar').style.background = pct>50?'linear-gradient(90deg,#ffe680,#ff9d00)':pct>25?'linear-gradient(90deg,#ff9d00,#ff5500)':'linear-gradient(90deg,#ff3c3c,#ff0000)';
    if(state.timer <= 0) {
      clearInterval(state.timerInterval);
      if(!state.answered) timeOut();
    }
  }, 100);
}

function answer(btn, chosen, correct) {
  if(state.answered) return;
  state.answered = true;
  clearInterval(state.timerInterval);

  const allBtns = document.querySelectorAll('.choice-btn');
  allBtns.forEach(b=>{ b.disabled=true; if(b.textContent===correct) b.classList.add('correct'); });

  const rect = btn.getBoundingClientRect();
  const cx = rect.left+rect.width/2, cy = rect.top+rect.height/2;

  if(chosen===correct) {
    btn.classList.add('correct');
    state.combo++;
    const pts = 100 + state.combo*20;
    state.score += pts;
    playCorrect();
    spawnParticles(cx,cy,'#ffe680',20);
    if(state.combo>=3) { playCombo(); showComboPopup(`${state.combo}콤보! +${pts}`); }
  } else {
    btn.classList.add('wrong');
    state.combo=0; state.lives--;
    playWrong();
    spawnParticles(cx,cy,'#ff3c3c',20);
    shakeScreen();
  }
  if(typeof LearningHub!=='undefined' && LearningHub.getCurrentUser()){
    const qObj=state.questions[state.idx];
    LearningHub.recordAnswer({gameId:'한국사탐험',subject:'사회',qKey:qObj.q,data:{q:qObj.q,era:qObj.era},correct:chosen===correct});
  }
  state.totalAnswered++;
  if(chosen===correct) state.totalCorrect++;
  updateHUD();
  if(state.lives<=0) { setTimeout(()=>{ clearInterval(state.timerInterval); endGame(); },900); return; }
  state.idx++;
  setTimeout(loadQuestion, 900);
}

function timeOut() {
  if(state.answered) return;
  state.answered=true;
  state.combo=0; state.lives--;
  playWrong();
  if(typeof LearningHub!=='undefined' && LearningHub.getCurrentUser()){
    const qObj=state.questions[state.idx];
    LearningHub.recordAnswer({gameId:'한국사탐험',subject:'사회',qKey:qObj.q,data:{q:qObj.q,era:qObj.era},correct:false});
  }
  state.totalAnswered++;
  const allBtns=document.querySelectorAll('.choice-btn');
  allBtns.forEach(b=>{ b.disabled=true; if(b.textContent===state.questions[state.idx].a) b.classList.add('correct'); });
  updateHUD();
  if(state.lives<=0) { setTimeout(endGame,900); return; }
  state.idx++;
  setTimeout(loadQuestion,900);
}

function updateHUD() {
  document.getElementById('score-display').textContent = state.score;
  document.getElementById('combo-display').textContent = state.combo;
  const hearts = document.getElementById('lives');
  hearts.innerHTML = '';
  for(let i=0;i<3;i++) {
    const s=document.createElement('span'); s.className='heart';
    s.textContent = i<state.lives ? '❤️' : '🖤'; hearts.appendChild(s);
  }
}

function showComboPopup(text) {
  const el = document.getElementById('combo-popup');
  el.textContent = text; el.style.opacity='1'; el.style.transform='translate(-50%,-70%) scale(1.2)';
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translate(-50%,-50%) scale(1)'; },800);
}

function shakeScreen() {
  document.body.style.animation='none';
  const qb = document.getElementById('question-box');
  qb.style.animation='shake 0.4s ease';
  setTimeout(()=>qb.style.animation='',400);
}

function endGame() {
  clearInterval(state.timerInterval);
  show('result-screen');
  const total = state.questions.length;
  const correct = Math.round(state.score/100); // 대략적 정답 수
  const pct = Math.min(100, Math.round(state.score / (total*100+total*(total-1)/2*20)*100));
  const eraName = state.era===-1 ? '전 시대' : ERAS[state.era].name;
  document.getElementById('result-era-name').textContent = `🏆 ${eraName} 완료!`;
  document.getElementById('final-score').textContent = `${state.score}점`;

  let grade='';
  if(state.score>=1200) grade='🥇 역사 천재!';
  else if(state.score>=800) grade='🥈 역사 탐험가!';
  else if(state.score>=400) grade='🥉 역사 입문자!';
  else grade='📚 다시 공부해봐요!';
  document.getElementById('final-grade').textContent=grade;
  document.getElementById('result-detail').textContent=`목숨 ${state.lives}개 남음 · 최고 콤보 ${state.combo}`;

  // 최고점 저장
  const key=`hs_${state.era}`;
  const prev=parseInt(localStorage.getItem(key)||'0');
  if(state.score>prev) localStorage.setItem(key,state.score);

  // 학습 허브: 플레이 기록 + 레벨평가 + EXP
  const levelMsgEl = document.getElementById('level-msg-h');
  levelMsgEl.textContent=''; levelMsgEl.className='level-msg-h';
  if(typeof LearningHub!=='undefined' && LearningHub.getCurrentUser() && state.totalAnswered>0){
    const accuracy = state.totalCorrect/state.totalAnswered;
    LearningHub.recordPlay('한국사탐험',{score:state.score,correct:state.totalCorrect,total:state.totalAnswered,grade:LearningHub.getGrade('사회')});
    const li = LearningHub.evaluateLevel('사회',accuracy,{upThreshold:0.8,downThreshold:0.4});
    if(li.changed){
      if(li.direction==='up'){
        levelMsgEl.textContent=`⬆️ 레벨업! 사회 ${li.newGrade}학년 난이도로 올라갑니다!`;
        levelMsgEl.classList.add('up');
      } else {
        levelMsgEl.textContent=`⬇️ 사회 ${li.newGrade}학년 난이도로 조정해서 다시 연습해봐요!`;
        levelMsgEl.classList.add('down');
      }
    }
    const expGain = state.totalCorrect*3 + (state.lives===3?15:0);
    const expResult = LearningHub.addExp(expGain,'한국사탐험');
    if(state.era===-1 && state.lives>0) LearningHub.unlockAchievement('한국사탐험','all_eras_clear');
    LearningHub.announceExpResult(expResult);
  }

  spawnParticles(window.innerWidth/2, window.innerHeight/2, '#ffe680', 40);
  playCombo();
}

function retryEra() { startEra(state.era); }
function goHome()   { bgColor='#0a0814'; show('start-screen'); renderProfileBadgeH(); }

function shuffle(arr) {
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

// 학습 허브: 프로필 뱃지 및 로그인
function renderProfileBadgeH(){
  const el=document.getElementById('profile-badge');
  if(!el) return;
  if(typeof LearningHub==='undefined' || !LearningHub.getCurrentUser()){
    el.innerHTML='';
    return;
  }
  const u=LearningHub.getCurrentUser();
  const grade=LearningHub.getGrade('사회');
  const reviewN=LearningHub.getReviewCount('한국사탐험','사회');
  el.innerHTML=`👤 <b>${LearningHub.escapeHtml(u.name)}</b> · 사회 ${LearningHub.gradeLabel(grade)}`+
    (reviewN>0?`<span class="review-tag-h">📝 복습문제 ${reviewN}개 포함</span>`:'');
}

if(typeof LearningHub!=='undefined'){
  LearningHub.injectBackLink();
  if(!LearningHub.getCurrentUser()){
    LearningHub.injectLoginModal(()=>{ renderProfileBadgeH(); });
  } else {
    renderProfileBadgeH();
  }
}
</script>

@keyframes shake {
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-8px)}
  40%{transform:translateX(8px)}
  60%{transform:translateX(-5px)}
  80%{transform:translateX(5px)}
}
