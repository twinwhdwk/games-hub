<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>⚡ 방정식 배틀</title>
<script src="js/core/event-bus.js"></script>
<script src="js/core/container.js"></script>
<script src="js/core/store.js"></script>
<script src="js/core/user.js"></script>
<script src="js/core/items.js"></script>
<script src="js/ui/toast.js"></script>
<script src="js/ui/modal.js"></script>
<script src="js/game/data-loader.js"></script>
<script src="js/game/quiz-engine.js"></script>
<script src="shared.js"></script>
<script src="js/battle-engine.js"></script>
<script src="js/game-init.js"></script>
<link rel="stylesheet" href="js/ui/theme.css">
<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif; background:#08081a; color:#e0e6ff; min-height:100vh; overflow-x:hidden; }
#wrap { max-width:640px; margin:0 auto; padding:12px 14px 80px; }

/* HUD */
#hud { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:12px; }
.hb { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); border-radius:10px; padding:8px 4px; text-align:center; }
.hb .v { font-size:1.2rem; font-weight:900; color:#fff; line-height:1.1; }
.hb .l { font-size:0.58rem; color:#666f8c; letter-spacing:1px; margin-top:2px; }

/* 전투 캔버스 */
#battle-canvas {
  width:100%; aspect-ratio:16/7; border-radius:16px;
  border:1.5px solid rgba(99,102,241,0.3);
  display:block; margin-bottom:12px;
  box-shadow:0 0 40px rgba(99,102,241,0.15), inset 0 0 60px rgba(0,0,0,0.5);
}

/* 스테이지 이름 */
#stage-label {
  text-align:center; font-size:0.75rem; color:#818cf8; font-weight:700;
  letter-spacing:2px; text-transform:uppercase; margin-bottom:8px;
}

/* HP 바들 */
#hp-bars { display:flex; gap:10px; align-items:center; margin-bottom:14px; }
.hp-side { flex:1; }
.hp-name { font-size:0.72rem; font-weight:800; color:#9ca3af; margin-bottom:4px; }
.hp-name.enemy { text-align:right; color:#f87171; }
.hp-bar-wrap { background:rgba(255,255,255,0.08); border-radius:100px; height:10px; overflow:hidden; }
.hp-bar { height:100%; border-radius:100px; transition:width .4s cubic-bezier(.34,1.56,.64,1); }
#hero-bar { background:linear-gradient(90deg,#22c55e,#86efac); }
#enemy-bar { background:linear-gradient(90deg,#ef4444,#fca5a5); float:right; }
.hp-val { font-size:0.68rem; color:#6b7280; margin-top:3px; }
.hp-val.enemy { text-align:right; }
.vs-sep { color:#ffd700; font-size:1.1rem; font-weight:900; flex-shrink:0; }

/* 문제 카드 */
#q-card {
  background:rgba(255,255,255,0.04); border:1.5px solid rgba(99,102,241,0.3);
  border-radius:16px; padding:18px; margin-bottom:12px;
  transition:border-color .2s;
}
#q-card.correct-border { border-color:#22c55e; box-shadow:0 0 20px rgba(34,197,94,0.2); }
#q-card.wrong-border { border-color:#ef4444; box-shadow:0 0 20px rgba(239,68,68,0.15); }
#q-meta { display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
.q-badge {
  padding:3px 9px; border-radius:100px; font-size:0.65rem; font-weight:700;
  border:1px solid;
}
#q-text { font-size:1.1rem; font-weight:800; line-height:1.5; color:#fff; }

/* 선택지 */
#choices { display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-bottom:12px; }
.choice {
  padding:13px 12px; border-radius:12px; background:rgba(255,255,255,0.05);
  border:2px solid rgba(255,255,255,0.09); color:#c4cde0;
  font-size:0.88rem; font-weight:700; cursor:pointer; font-family:inherit;
  text-align:left; transition:.12s; min-height:52px; word-break:keep-all; line-height:1.4;
}
.choice:hover:not(:disabled) { border-color:#6366f1; color:#fff; background:rgba(99,102,241,0.1); }
.choice.correct { background:rgba(34,197,94,0.15); border-color:#22c55e; color:#4ade80; }
.choice.wrong   { background:rgba(239,68,68,0.15); border-color:#ef4444; color:#f87171; }
.choice:disabled { cursor:default; }

/* 피드백 */
#feedback {
  padding:11px 14px; border-radius:11px; font-size:0.88rem; font-weight:700;
  margin-bottom:10px; display:none; line-height:1.4;
}
#feedback.ok { background:rgba(34,197,94,.1); color:#4ade80; border:1px solid rgba(34,197,94,.2); }
#feedback.ng { background:rgba(239,68,68,.1); color:#f87171; border:1px solid rgba(239,68,68,.2); }
#next-btn {
  width:100%; padding:15px; border-radius:13px; border:none;
  background:linear-gradient(135deg,#6366f1,#8b5cf6); color:#fff;
  font-size:1rem; font-weight:900; cursor:pointer; display:none; font-family:inherit;
  transition:.15s;
}
#next-btn:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(99,102,241,.4); }

/* 결과 화면 */
#result {
  display:none; text-align:center; padding:32px 16px;
  background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08);
  border-radius:20px;
}
#result h2 { font-size:1.8rem; margin-bottom:6px; }
.rg {
  font-size:4.5rem; font-weight:900; margin:10px 0;
  background:linear-gradient(135deg,#6366f1,#a855f7);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
}
.rs { color:#8892a4; font-size:0.88rem; margin-bottom:5px; }
.rb {
  margin-top:18px; padding:13px 28px; border-radius:100px; border:none;
  background:linear-gradient(135deg,#6366f1,#8b5cf6); color:#fff;
  font-size:0.92rem; font-weight:900; cursor:pointer; font-family:inherit; margin:6px;
}
.rb.sec { background:rgba(255,255,255,0.08); color:#c4cde0; }

/* 스킬 이름 팝업 */
#skill-pop {
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
  font-size:1.5rem; font-weight:900; color:#ffd700;
  text-shadow:0 0 20px rgba(255,215,0,.8);
  pointer-events:none; opacity:0; transition:opacity .1s;
  z-index:100; white-space:nowrap;
}
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div class="hb"><div class="v" id="h-stage">1</div><div class="l">스테이지</div></div>
    <div class="hb"><div class="v" id="h-q">0</div><div class="l">문제</div></div>
    <div class="hb"><div class="v" id="h-ok" style="color:#4ade80">0</div><div class="l">정답</div></div>
    <div class="hb"><div class="v" id="h-sk" style="color:#ffd700">0</div><div class="l">연속</div></div>
  </div>

  <div id="stage-label">⚔️ 스테이지 1 — 고블린 소굴</div>

  <canvas id="battle-canvas" width="640" height="280"></canvas>

  <div id="charge-bar-wrap" style="margin-bottom:10px;">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
    <span style="font-size:0.65rem;color:#a855f7;font-weight:800;letter-spacing:1px;">⚡ ULTIMATE GAUGE</span>
    <span id="charge-label" style="font-size:0.65rem;color:#6b7280;font-weight:700;">0%</span>
  </div>
  <div style="background:rgba(255,255,255,0.07);border-radius:100px;height:8px;overflow:hidden;">
    <div id="charge-bar" style="height:100%;width:0%;border-radius:100px;background:linear-gradient(90deg,#7c3aed,#a855f7);transition:width .3s;box-shadow:0 0 8px #a855f744;"></div>
  </div>
</div>
<div id="hp-bars">
    <div class="hp-side">
      <div class="hp-name" id="hero-name">탐험가</div>
      <div class="hp-bar-wrap"><div class="hp-bar" id="hero-bar" style="width:100%"></div></div>
      <div class="hp-val" id="hero-hp-val">100 / 100</div>
    </div>
    <div class="vs-sep">⚡</div>
    <div class="hp-side">
      <div class="hp-name enemy" id="enemy-name-label">고블린</div>
      <div class="hp-bar-wrap"><div class="hp-bar" id="enemy-bar" style="width:100%;float:right"></div></div>
      <div class="hp-val enemy" id="enemy-hp-val">80 / 80</div>
    </div>
  </div>

  <div id="q-card">
    <div id="q-meta">
      <span class="q-badge" style="color:#818cf8;border-color:rgba(129,140,248,.4)">수학</span>
      <span class="q-badge" id="q-grade-badge" style="color:#67e8f9;border-color:rgba(103,232,249,.3)">중1</span>
    </div>
    <div id="q-text">문제 로딩 중...</div>
  </div>

  <div id="choices">
    <button class="choice" onclick="choose(0)"></button>
    <button class="choice" onclick="choose(1)"></button>
    <button class="choice" onclick="choose(2)"></button>
    <button class="choice" onclick="choose(3)"></button>
  </div>

  <div id="feedback"></div>
  <button id="next-btn" onclick="nextQ()">다음 문제 →</button>

  <div id="result">
    <h2 id="r-em">🏆</h2>
    <div class="rg" id="r-g">S</div>
    <div class="rs" id="r-s1"></div>
    <div class="rs" id="r-s2"></div>
    <div class="rs" id="r-s3"></div>
    <button class="rb" onclick="restart()">⚔️ 다시 도전</button>
    <button class="rb sec" onclick="location.href='index.html'">← 허브</button>
  </div>
</div>

<div id="skill-pop"></div>

<script>
'use strict';
const GAME_ID  = '방정식배틀';
const TOTAL_Q  = 20;
const STAGE_NAMES = ['고블린 소굴','해골 동굴','마법사 탑','슬라임 왕궁','드래곤 소굴'];

let heroHP = 100, heroMaxHP = 100;
let enemyHP = 0,  enemyMaxHP = 0;
let stageIdx = 0, ok = 0, bad = 0, streak = 0, bestStreak = 0;
let engine = null;
let _quiz  = null;

const gl = g => g<=9 ? `중${g-6}` : `고${g-9}`;

// ── Battle Engine ─────────────────────────────────────────
function setupEngine() {
  const canvas = document.getElementById('battle-canvas');
  if (!canvas || !window.BattleEngine) return;
  engine = new BattleEngine(canvas, { bgColor:'#06061a', groundY:0.75, heroX:0.2, enemyX:0.72 });
  const user = LearningHub.getCurrentUser();
  if (user) { const c = LearningHub.getCharacter(); if (c) engine.setHero(c.equipped); }
  engine.on('attackEnd',  () => { document.getElementById('next-btn').style.display = 'block'; });
  engine.on('monsterDead',() => {
    stageIdx++;
    if (stageIdx < BattleEngine.MONSTERS.length) setTimeout(() => spawnMonster(stageIdx), 800);
  });
  if (typeof Bus !== 'undefined') {
    Bus.on('engine:refresh', () => {
      const ch = LearningHub.getCharacter();
      if (ch && engine) engine.setHero(ch.equipped);
    });
  }
}

function spawnMonster(idx) {
  const m = BattleEngine.MONSTERS[idx % BattleEngine.MONSTERS.length];
  const bonus = Math.floor(idx / BattleEngine.MONSTERS.length);
  enemyMaxHP = m.hp + bonus * 30;
  enemyHP    = enemyMaxHP;
  engine.setMonster({ ...m, hpPct:1 });
  updateEnemy(m.name, enemyHP, enemyMaxHP);
  document.getElementById('h-stage').textContent = idx + 1;
  document.getElementById('stage-label').textContent =
    `⚔️ 스테이지 ${idx+1} — ${STAGE_NAMES[idx % STAGE_NAMES.length]}`;
}

// ── QuizEngine ───────────────────────────────────────────
async function init() {
  setupEngine();

  _quiz = new QuizEngine({
    gameId:  GAME_ID,
    subject: '수학',
    tier:    'middle',
    total:   TOTAL_Q,

    onQuestion(q, idx, total) {
      document.querySelectorAll('.choice').forEach((b,i) => {
        b.textContent = q.choices[i] || '';
        b.className = 'choice'; b.disabled = false;
      });
      document.getElementById('q-grade-badge').textContent = gl(q.grade) + '학년';
      document.getElementById('q-text').textContent = q.q;
      document.getElementById('q-card').className = 'q-card';
      document.getElementById('feedback').style.display = 'none';
      document.getElementById('next-btn').style.display  = 'none';
      document.getElementById('h-q').textContent = idx + 1;
    },

    onResult(isCorrect, q, stats) {
      ok = stats.correct; bad = stats.wrong;
      streak = stats.streak; bestStreak = stats.bestStreak;
      document.getElementById('h-ok').textContent = ok;
      document.getElementById('h-sk').textContent = streak;

      document.querySelectorAll('.choice').forEach((b,i) => {
        b.disabled = true;
        if (i === q.answer) b.classList.add('correct');
        else if (!isCorrect && i === [...document.querySelectorAll('.choice')].indexOf(
          document.querySelector('.choice:disabled:not(.correct)') )) b.classList.add('wrong');
      });

      if (isCorrect) {
        document.getElementById('q-card').className = 'q-card correct-border';
        const dmg = Math.floor(12 + streak * 3 + Math.random() * 8);
        enemyHP = Math.max(0, enemyHP - dmg);
        const useUlt  = engine && engine.chargeLevel >= 1;
        const skill   = useUlt ? 'ultimate' : streak >= 5 ? 'magic' : streak >= 2 ? 'slash' : 'arrow';
        if (streak >= 3) showSkillPop(streak >= 5 ? '💥 SUPER COMBO!' : `🔥 ${streak} COMBO!`);
        setFeedback(true, `✅ 정답! ${dmg} 데미지${streak > 1 ? ' (' + streak + '연속!)' : ''}`);
        if (engine) {
          engine.setMonster({ ...BattleEngine.MONSTERS[stageIdx % BattleEngine.MONSTERS.length], hpPct: enemyHP / enemyMaxHP });
          engine.playHeroAttack(skill, { dmgText: dmg + '!' });
        }
        updateEnemy(null, enemyHP, enemyMaxHP);
        if (enemyHP <= 0 && engine) engine.playMonsterDeath();

        // 차지 게이지 UI
        if (engine) {
          const pct = Math.round(engine.chargeLevel * 100);
          const bar = document.getElementById('charge-bar');
          const lbl = document.getElementById('charge-label');
          if (bar) { bar.style.width = pct + '%'; bar.style.background = pct >= 100 ? 'linear-gradient(90deg,#ffd700,#f59e0b)' : 'linear-gradient(90deg,#7c3aed,#a855f7)'; }
          if (lbl) { lbl.textContent = pct >= 100 ? '⚡ READY!' : pct + '%'; lbl.style.color = pct >= 100 ? '#ffd700' : '#6b7280'; }
          if (pct >= 100) engine.playUltimateCharge();
        }
      } else {
        document.getElementById('q-card').className = 'q-card wrong-border';
        const heroDmg = 18;
        heroHP = Math.max(0, heroHP - heroDmg);
        updateHero(heroHP, heroMaxHP);
        if (engine) { engine.playMonsterAttack(); engine.playHeroDamage(heroDmg); }
        setFeedback(false, `❌ 오답! 적의 반격! (정답: ${q.choices[q.answer]})`);
        setTimeout(() => { document.getElementById('next-btn').style.display = 'block'; }, 600);
        if (heroHP <= 0) { if (engine) engine.playGameOver(); setTimeout(() => endGame(true), 1200); return; }
      }
    },

    onEnd(summary) {
      endGame(false, summary);
    },
  });

  await _quiz.init();
  spawnMonster(0);
  _quiz.start();
}

function nextQ() { if (_quiz) _quiz.next(); }

function choose(i) { if (_quiz) _quiz.answer(i); }

function setFeedback(isOk, msg) {
  const el = document.getElementById('feedback');
  el.textContent = msg; el.className = isOk ? 'ok' : 'ng'; el.style.display = 'block';
}

function updateHero(hp, max) {
  document.getElementById('hero-bar').style.width  = Math.max(0, hp/max*100) + '%';
  document.getElementById('hero-hp-val').textContent = `${hp} / ${max}`;
}
function updateEnemy(name, hp, max) {
  if (name) document.getElementById('enemy-name-label').textContent = name;
  document.getElementById('enemy-bar').style.width  = Math.max(0, hp/max*100) + '%';
  document.getElementById('enemy-hp-val').textContent = `${hp} / ${max}`;
}
function showSkillPop(text) {
  const el = document.getElementById('skill-pop');
  el.textContent = text; el.style.opacity = '1';
  setTimeout(() => { el.style.opacity = '0'; }, 900);
}

// ── 게임 종료 ─────────────────────────────────────────────
function endGame(defeated, summary = {}) {
  ['q-card','choices','feedback','next-btn','hp-bars','stage-label','charge-bar-wrap']
    .forEach(id => { const el=document.getElementById(id); if(el) el.style.display='none'; });
  document.getElementById('result').style.display = 'block';

  const { acc = 0, grade = 'D' } = summary;
  const isDefeated = defeated || heroHP <= 0;
  const finalGrade = isDefeated ? 'D' : grade;
  const em = {S:'🏆',A:'🥇',B:'🥈',C:'🥉',D:'💀'};
  document.getElementById('r-em').textContent = em[finalGrade] || '🎮';
  document.getElementById('r-g').textContent  = finalGrade;
  document.getElementById('r-s1').textContent = `정답 ${ok}/${ok+bad} (${Math.round((ok/(ok+bad||1))*100)}%)`;
  document.getElementById('r-s2').textContent = `최대 연속 콤보: ${bestStreak}`;
  document.getElementById('r-s3').textContent = `클리어 스테이지: ${stageIdx}`;
  if (!isDefeated && engine) engine.playStageClear();
}

function restart() {
  heroHP=100; ok=0; bad=0; streak=0; bestStreak=0; stageIdx=0;
  ['q-card','choices','hp-bars','stage-label','charge-bar-wrap']
    .forEach(id => { const el=document.getElementById(id); if(el) el.style.display=''; });
  document.getElementById('choices').style.display = 'grid';
  document.getElementById('result').style.display  = 'none';
  updateHero(heroHP, heroMaxHP);
  if (_quiz) _quiz.restart();
  spawnMonster(0);
}

GameInit.start(GAME_ID, init, { checkStreak:true });
</script>
</body>
</html>
