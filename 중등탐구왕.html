<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🔭 중등 탐구왕</title>
<script src="js/core/event-bus.js"></script>
<script src="js/core/container.js"></script>
<script src="js/core/store.js"></script>
<script src="js/core/user.js"></script>
<script src="js/core/items.js"></script>
<script src="js/ui/toast.js"></script>
<script src="js/ui/modal.js"></script>
<script src="js/game/data-loader.js"></script>
<script src="js/game/quiz-engine.js"></script>
<script src="shared.js"></script>
<script src="js/battle-engine.js"></script>
<script src="js/game-init.js"></script>
<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif; background:#0c0c18; color:#e0e6ff; min-height:100vh; }
#wrap { max-width:600px; margin:0 auto; padding:16px 16px 80px; }

/* 과목 선택 */
#subject-select { margin-bottom:20px; }
#subject-select h2 { font-size:1.1rem; font-weight:900; color:#fff; margin-bottom:12px; }
.subj-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.subj-btn {
  padding:16px 12px; border-radius:14px; border:2px solid rgba(255,255,255,0.1);
  background:rgba(255,255,255,0.04); cursor:pointer; font-family:inherit;
  color:#c4cde0; font-size:0.95rem; font-weight:700; text-align:center; transition:.15s;
}
.subj-btn:hover { border-color:var(--color); background:rgba(255,255,255,0.08); color:#fff; }
.subj-btn .icon { font-size:1.8rem; display:block; margin-bottom:6px; }
.subj-btn.all { grid-column:1/-1; }

/* HUD */
#hud { display:flex; gap:10px; margin-bottom:14px; }
.hb { flex:1; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.08); border-radius:11px; padding:9px 4px; text-align:center; }
.hb .v { font-size:1.2rem; font-weight:900; color:#fff; }
.hb .l { font-size:0.58rem; color:#666f8c; letter-spacing:1px; }

/* 타이머바 */
#timer-wrap { background:rgba(255,255,255,0.07); border-radius:100px; height:5px; margin-bottom:16px; }
#timer-bar { height:100%; border-radius:100px; background:linear-gradient(90deg,#10b981,#06b6d4); transition:width .1s linear; }

/* 문제 */
#q-box { background:rgba(255,255,255,0.04); border:1.5px solid rgba(255,255,255,0.1); border-radius:18px; padding:20px; margin-bottom:14px; }
#q-meta { display:flex; gap:8px; align-items:center; margin-bottom:10px; flex-wrap:wrap; }
.q-tag {
  padding:3px 9px; border-radius:100px; font-size:0.67rem; font-weight:700;
  border:1px solid;
}
#q-text { font-size:1.1rem; font-weight:800; line-height:1.6; color:#fff; }

/* 선택지 */
#choices { display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-bottom:12px; }
.choice {
  padding:13px 10px; border-radius:12px; background:rgba(255,255,255,0.05);
  border:2px solid rgba(255,255,255,0.09); color:#c4cde0; font-size:0.88rem; font-weight:700;
  cursor:pointer; font-family:inherit; text-align:left; transition:.1s; min-height:50px; word-break:keep-all;
}
.choice:hover:not(:disabled) { border-color:#a78bfa; color:#fff; }
.choice.correct { background:rgba(34,197,94,.12); border-color:#22c55e; color:#4ade80; }
.choice.wrong   { background:rgba(239,68,68,.12);  border-color:#ef4444; color:#f87171; }

/* 피드백 */
#fb { padding:11px 14px; border-radius:11px; font-size:0.85rem; font-weight:700; margin-bottom:12px; display:none; }
#fb.ok { background:rgba(34,197,94,.1); color:#4ade80; }
#fb.ng { background:rgba(239,68,68,.1); color:#f87171; }
#next-btn {
  width:100%; padding:14px; border-radius:13px; border:none;
  background:linear-gradient(135deg,#7c3aed,#a855f7); color:#fff;
  font-size:1rem; font-weight:900; cursor:pointer; display:none; font-family:inherit;
}

/* 결과 */
#result { display:none; text-align:center; padding:28px 16px; }
#result h2 { font-size:1.7rem; margin-bottom:6px; }
.rg {
  font-size:3.5rem; font-weight:900; margin:12px 0;
  background:linear-gradient(135deg,#7c3aed,#a855f7);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
}
.rs { color:#8892a4; font-size:0.85rem; margin-bottom:5px; }
.rb {
  margin-top:16px; padding:12px 26px; border-radius:100px; border:none;
  background:linear-gradient(135deg,#7c3aed,#a855f7); color:#fff;
  font-size:0.9rem; font-weight:900; cursor:pointer; font-family:inherit; margin-right:8px;
}
.rb.s { background:rgba(255,255,255,0.08); color:#c4cde0; }
</style>
</head>
<body>
<div id="wrap">

  <!-- 과목 선택 -->
  <div id="subject-select">
    <h2>🔭 중등 탐구왕 — 과목 선택</h2>
    <div class="subj-grid">
      <button class="subj-btn" style="--color:#8b5cf6" onclick="startGame('과학')">
        <span class="icon">🔬</span>과학
      </button>
      <button class="subj-btn" style="--color:#3b82f6" onclick="startGame('사회')">
        <span class="icon">🏛</span>사회
      </button>
      <button class="subj-btn" style="--color:#22c55e" onclick="startGame('국어')">
        <span class="icon">📖</span>국어
      </button>
      <button class="subj-btn all" style="--color:#f59e0b" onclick="startGame('전체')">
        <span class="icon">🌐</span>전체 랜덤 (과학+사회+국어)
      </button>
    </div>
  </div>

  <!-- 게임 화면 -->
  <div id="game" style="display:none;">
    <canvas id="battle-canvas" width="600" height="160" style="width:100%;border-radius:12px;border:1px solid rgba(16,185,129,0.2);display:none;margin-bottom:10px;"></canvas>
    <div id="hud">
      <div class="hb"><div class="v" id="h-q">1</div><div class="l">문제</div></div>
      <div class="hb"><div class="v" id="h-ok">0</div><div class="l">정답</div></div>
      <div class="hb"><div class="v" id="h-sk">0</div><div class="l">연속</div></div>
      <div class="hb"><div class="v" id="h-t">30</div><div class="l">초</div></div>
    </div>
    <div id="timer-wrap"><div id="timer-bar" style="width:100%"></div></div>

    <div id="q-box">
      <div id="q-meta">
        <span class="q-tag" id="q-subj-tag" style="color:#a78bfa;border-color:rgba(167,139,250,.4)"></span>
        <span class="q-tag" id="q-grade-tag" style="color:#67e8f9;border-color:rgba(103,232,249,.3)"></span>
        <span id="q-unit-tag" style="font-size:0.65rem;color:#666f8c;"></span>
      </div>
      <div id="q-text">문제 로딩중...</div>
    </div>

    <div id="choices">
      <button class="choice" onclick="choose(0)"></button>
      <button class="choice" onclick="choose(1)"></button>
      <button class="choice" onclick="choose(2)"></button>
      <button class="choice" onclick="choose(3)"></button>
    </div>
    <div id="fb"></div>
    <button id="next-btn" onclick="nextQ()">다음 →</button>
  </div>

  <!-- 결과 -->
  <div id="result">
    <h2 id="r-em">🏅</h2>
    <div class="rg" id="r-g">A</div>
    <div class="rs" id="r-s1"></div>
    <div class="rs" id="r-s2"></div>
    <div class="rs" id="r-s3"></div>
    <button class="rb" onclick="backToSelect()">다른 과목</button>
    <button class="rb s" onclick="location.href='index.html'">허브로</button>
  </div>
</div>

<script>
const GAME_ID = '중등탐구왕';
const TOTAL = 20, TIME_PER_Q = 30;
const SUBJ_COLORS = { 과학:'#8b5cf6', 사회:'#3b82f6', 국어:'#22c55e' };
const SUBJ_ICONS  = { 과학:'🔬', 사회:'🏛', 국어:'📖' };

let allQ = {}, queue = [], qIdx = 0;
let ok = 0, sk = 0, bestSk = 0, answered = false;
let curSubj = '과학', timer = null, timeLeft = TIME_PER_Q;
let gradeMap = { 과학:7, 사회:7, 국어:7 };

function gl(g) { return g <= 9 ? `중${g-6}학년` : `고${g-9}학년`; }

async function load() {
  const res = await fetch('data/question_bank.json');
  const bank = await res.json();
  ['과학','사회','국어'].forEach(s => {
    allQ[s] = (bank[s]||[]).filter(q => q.grade>=7 && q.grade<=9);
  });
}

function pick(subj) {
  let pool = [];
  if (subj === '전체') {
    ['과학','사회','국어'].forEach(s => pool.push(...allQ[s].map(q => ({...q, subject:s}))));
  } else {
    pool = (allQ[subj]||[]).map(q => ({...q, subject:subj}));
  }
  return [...pool].sort(() => Math.random()-.5).slice(0, TOTAL);
}

let _engine = null;

function _setupBattle(subj) {
  const canvas = document.getElementById('battle-canvas');
  if (!canvas || !window.BattleEngine) return;
  canvas.style.display = 'block';
  _engine = new BattleEngine(canvas, { bgColor:'#060c10', groundY:0.76, heroX:0.2, enemyX:0.7 });
  if (typeof LearningHub !== 'undefined' && LearningHub.getCurrentUser()) {
    const c = LearningHub.getCharacter();
    if (c) _engine.setHero(c.equipped);
  }
  const mIdx = subj==='과학' ? 4 : subj==='사회' ? 3 : 1;
  _engine.setMonster({ ...BattleEngine.MONSTERS[mIdx % BattleEngine.MONSTERS.length], hpPct:1 });
}

function startGame(subj) {
  curSubj = subj;
  if (typeof LearningHub !== 'undefined' && LearningHub.getCurrentUser()) {
    if (subj !== '전체') gradeMap[subj] = Math.max(7, Math.min(9, LearningHub.getGrade(subj)));
  }
  queue = pick(subj);
  qIdx = 0; ok = 0; sk = 0; bestSk = 0;
  document.getElementById('subject-select').style.display = 'none';
  document.getElementById('result').style.display = 'none';
  document.getElementById('game').style.display = 'block';
  _setupBattle(subj);
  showQ();
}

function showQ() {
  answered = false;
  clearTimeout(timer);
  if (qIdx >= queue.length) { endGame(); return; }
  const q = queue[qIdx];
  const subj = q.subject || curSubj;

  document.getElementById('q-subj-tag').textContent = SUBJ_ICONS[subj] + ' ' + subj;
  document.getElementById('q-subj-tag').style.color = SUBJ_COLORS[subj] || '#a78bfa';
  document.getElementById('q-grade-tag').textContent = gl(q.grade);
  document.getElementById('q-unit-tag').textContent = q.unit || '';
  document.getElementById('q-text').textContent = q.q;

  document.querySelectorAll('.choice').forEach((b,i) => {
    b.textContent = q.choices[i]||''; b.className='choice'; b.disabled=false;
  });
  document.getElementById('fb').style.display = 'none';
  document.getElementById('next-btn').style.display = 'none';
  document.getElementById('h-q').textContent = qIdx+1;

  // 타이머
  timeLeft = TIME_PER_Q;
  runTimer();
}

function runTimer() {
  document.getElementById('h-t').textContent = timeLeft;
  document.getElementById('timer-bar').style.width = (timeLeft/TIME_PER_Q*100)+'%';
  document.getElementById('timer-bar').style.background =
    timeLeft > 10 ? 'linear-gradient(90deg,#10b981,#06b6d4)' : 'linear-gradient(90deg,#ef4444,#f97316)';
  if (timeLeft <= 0) { choose(-1); return; } // 시간 초과
  timer = setTimeout(() => { timeLeft--; runTimer(); }, 1000);
}

function choose(i) {
  if (answered) return;
  answered = true;
  clearTimeout(timer);
  const q = queue[qIdx];
  const isOk = i === q.answer;

  document.querySelectorAll('.choice').forEach((b,j) => {
    b.disabled = true;
    if (j===q.answer) b.classList.add('correct');
    else if (j===i && !isOk) b.classList.add('wrong');
  });

  const subj = q.subject || curSubj;
  if (typeof LearningHub !== 'undefined' && LearningHub.getCurrentUser()) {
    LearningHub.recordAnswer({
      gameId:GAME_ID, subject:subj, qKey:q.q.slice(0,40),
      data:{q:q.q, choices:q.choices, answer:q.answer, unit:q.unit, grade:q.grade},
      correct:isOk,
    });
  }

  if (isOk) {
    ok++; sk++; bestSk = Math.max(bestSk, sk);
    if (_engine) {
      const useUlt = _engine.chargeLevel >= 1;
      _engine.playHeroAttack(useUlt ? 'ultimate' : sk >= 4 ? 'magic' : sk >= 2 ? 'arrow' : 'slash');
    }
    setFb(true, '✅ 정답!' + (sk>=3 ? ` 🔥 ${sk}연속!`:''));
  } else if (i === -1) {
    sk = 0;
    if (_engine) { _engine.playMonsterAttack(); _engine.playHeroDamage(15); } setFb(false, `⏰ 시간 초과! 정답: ${q.choices[q.answer]}`);
  } else {
    sk = 0;
    if (_engine) { _engine.playMonsterAttack(); _engine.playHeroDamage(10); }
    setFb(false, `❌ 오답! 정답: ${q.choices[q.answer]}`);
  }
  document.getElementById('h-ok').textContent = ok;
  document.getElementById('h-sk').textContent = sk;
  document.getElementById('next-btn').style.display = 'block';
  qIdx++;

  // 학년 조정 (5문제마다)
  if (qIdx % 5 === 0 && subj !== '전체' && typeof LearningHub !== 'undefined' && LearningHub.getCurrentUser()) {
    const acc = ok / qIdx;
    const r = LearningHub.evaluateLevel(subj, acc, {minGrade:7, maxGrade:9});
    gradeMap[subj] = LearningHub.getGrade(subj);
    if (r.changed) LearningHub.showToast(r.direction==='up'?'⬆️ 레벨업!':'⬇️ 난이도 조정');
  }
}

function setFb(ok, msg) {
  const el = document.getElementById('fb');
  el.textContent = msg; el.className = ok ? 'ok':'ng'; el.style.display='block';
}

function nextQ() { showQ(); }

function endGame() {
  clearTimeout(timer);
  document.getElementById('game').style.display = 'none';
  document.getElementById('result').style.display = 'block';
  const total = qIdx, acc = total ? ok/total : 0;
  const g = acc>=.9?'S':acc>=.75?'A':acc>=.6?'B':acc>=.4?'C':'D';
  const em = {S:'🏆',A:'🏅',B:'📚',C:'✏️',D:'😅'};
  document.getElementById('r-em').textContent = em[g];
  document.getElementById('r-g').textContent = g;
  document.getElementById('r-s1').textContent = `정답 ${ok}/${total} (${Math.round(acc*100)}%)`;
  document.getElementById('r-s2').textContent = `최대 연속: ${bestSk}`;
  document.getElementById('r-s3').textContent = `과목: ${curSubj}`;
  if (typeof LearningHub !== 'undefined' && LearningHub.getCurrentUser()) {
    GameInit.finish(GAME_ID, ok*7 + (bestSk>=5?25:0), '중등탐구왕');
  }
}

function backToSelect() {
  document.getElementById('result').style.display = 'none';
  document.getElementById('subject-select').style.display = 'block';
}

GameInit.start(GAME_ID, async () => { await load(); }, { checkStreak:true });
</script>
</body>
</html>
