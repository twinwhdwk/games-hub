<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🧭 지식 탐험대</title>
<script src="js/core/event-bus.js"></script>
<script src="js/core/container.js"></script>
<script src="js/core/store.js"></script>
<script src="js/core/user.js"></script>
<script src="js/core/items.js"></script>
<script src="js/ui/toast.js"></script>
<script src="js/ui/modal.js"></script>
<script src="js/game/data-loader.js"></script>
<script src="js/game/quiz-engine.js"></script>
<script src="shared.js"></script>
<script src="js/game-init.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: radial-gradient(ellipse at top, #1a2a4a 0%, #06070f 70%);
  color:#fff; font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  overflow-x:hidden;
}
#app { width:100%; max-width:520px; padding:18px; }

/* ── 공통 카드 ── */
.card {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 20px;
  padding: 24px;
  backdrop-filter: blur(10px);
}

.title {
  font-size: clamp(24px,6vw,34px);
  font-weight: 900;
  text-align: center;
  background: linear-gradient(135deg,#00d4ff,#a855f7,#ffd166);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  margin-bottom: 6px;
}
.subtitle { text-align:center; color:#8892a4; font-size:0.85rem; margin-bottom:18px; }

#profile-badge { text-align:center; font-size:0.8rem; color:#88ccff; margin-bottom:14px; }
#profile-badge b { color:#ffd700; }
.review-tag {
  display:inline-block; margin-left:6px; font-size:0.7rem; color:#ffd166;
  background:rgba(255,209,102,0.12); border:1px solid rgba(255,209,102,0.35);
  border-radius:8px; padding:2px 8px;
}

/* ── 과목 선택 ── */
.subject-grid { display:flex; flex-direction:column; gap:10px; margin-bottom:18px; }
.subject-btn {
  display:flex; align-items:center; gap:14px;
  background: rgba(255,255,255,0.05);
  border: 2px solid rgba(255,255,255,0.08);
  border-radius: 14px; padding: 14px 16px;
  cursor:pointer; transition:.15s;
}
.subject-btn:hover { border-color:#7c7cff; background:rgba(124,124,255,0.1); }
.subject-icon { font-size:2rem; }
.subject-info { flex:1; }
.subject-name { font-weight:800; font-size:1.05rem; }
.subject-grade { font-size:0.75rem; color:#8892a4; margin-top:2px; }

.start-btn {
  display:block; width:100%; padding:14px; border:none; border-radius:14px;
  background:linear-gradient(135deg,#00d4ff,#a855f7); color:#06070f; font-weight:900;
  font-size:1.05rem; cursor:pointer; letter-spacing:1px;
}
.start-btn:hover { filter:brightness(1.1); }
.start-btn:disabled { opacity:.4; cursor:not-allowed; }

/* ── 퀴즈 화면 ── */
#quiz-screen { display:none; }
.quiz-top {
  display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;
  font-size:0.85rem; color:#c4cde0;
}
.timer-bar-wrap { height:8px; background:rgba(255,255,255,0.08); border-radius:100px; overflow:hidden; margin-bottom:18px; }
.timer-bar-fill { height:100%; background:linear-gradient(90deg,#00d4ff,#ffd166,#ff6b6b); border-radius:100px; transition:width .1s linear; }

.unit-tag {
  display:inline-block; font-size:0.7rem; font-weight:700; color:#a855f7;
  background:rgba(168,85,247,0.12); border:1px solid rgba(168,85,247,0.35);
  border-radius:100px; padding:3px 10px; margin-bottom:10px;
}
.review-badge {
  display:inline-block; font-size:0.7rem; font-weight:700; color:#ffd166;
  background:rgba(255,209,102,0.12); border:1px solid rgba(255,209,102,0.35);
  border-radius:100px; padding:3px 10px; margin-bottom:10px; margin-left:6px;
}

.question-text { font-size:clamp(17px,4.5vw,22px); font-weight:800; line-height:1.5; margin-bottom:20px; min-height:60px; }

.choices { display:flex; flex-direction:column; gap:10px; }
.choice-btn {
  text-align:left; padding:14px 16px; border-radius:12px;
  background:rgba(255,255,255,0.05); border:2px solid rgba(255,255,255,0.08);
  color:#fff; font-size:0.95rem; cursor:pointer; transition:.12s;
}
.choice-btn:hover { border-color:#7c7cff; background:rgba(124,124,255,0.1); }
.choice-btn.correct { border-color:#4ade80; background:rgba(74,222,128,0.18); }
.choice-btn.wrong { border-color:#ff6b6b; background:rgba(255,107,107,0.18); }
.choice-btn.disabled { pointer-events:none; opacity:.7; }

/* ── 결과 화면 ── */
#result-screen { display:none; text-align:center; }
.result-emoji { font-size:3.5rem; margin-bottom:8px; }
.result-score { font-size:2rem; font-weight:900; margin-bottom:4px; }
.result-sub { color:#8892a4; font-size:0.9rem; margin-bottom:14px; }
.level-msg { font-size:0.95rem; font-weight:700; margin-bottom:14px; }
.level-msg.up { color:#4ade80; }
.level-msg.down { color:#ff9a76; }
.wrong-review {
  text-align:left; background:rgba(255,107,107,0.08); border:1px solid rgba(255,107,107,0.25);
  border-radius:12px; padding:12px 14px; margin-bottom:14px; font-size:0.85rem; line-height:1.8;
  max-height:160px; overflow-y:auto;
}

.btn-row { display:flex; gap:10px; }
.btn-row .start-btn { flex:1; }
.secondary-btn {
  flex:1; padding:14px; border:2px solid rgba(255,255,255,0.15); border-radius:14px;
  background:transparent; color:#c4cde0; font-weight:800; font-size:0.95rem; cursor:pointer;
}

a.back-link { display:block; text-align:center; margin-top:14px; color:#8892a4; font-size:0.8rem; text-decoration:none; }
a.back-link:hover { color:#fff; }
</style>
</head>
<body>

<div id="app">
  <div class="card">
    <div class="title">🧭 지식 탐험대</div>
    <div class="subtitle">사회 · 과학 · 국어 — 교과 지식 캡슐을 모으자!</div>
    <div id="profile-badge"></div>

    <!-- 시작 화면 -->
    <div id="start-screen">
      <div class="subject-grid" id="subject-grid"></div>
      <button class="start-btn" id="start-btn" disabled>탐험을 시작하려면 과목을 선택하세요</button>
    </div>

    <!-- 퀴즈 화면 -->
    <div id="quiz-screen">
      <!-- 상단 HUD -->
      <div class="quiz-top">
        <span id="q-num">1 / 15</span>
        <span id="q-timer" style="font-weight:900;font-size:1.2rem;color:#60a5fa;">30</span>
        <span>✅<b id="q-correct">0</b> ❌<b id="q-wrong">0</b></span>
      </div>
      <!-- 진행바 + 타이머바 -->
      <div class="timer-bar-wrap">
        <div class="timer-bar-fill" id="timer-fill" style="width:100%;transition:width 1s linear;"></div>
      </div>
      <div style="height:4px;background:rgba(255,255,255,.06);border-radius:2px;margin-bottom:14px;">
        <div id="q-progress-fill" style="height:100%;background:linear-gradient(90deg,#6366f1,#a855f7);border-radius:2px;width:0%;transition:width .3s;"></div>
      </div>
      <!-- 메타 -->
      <div style="display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;">
        <span class="q-badge" id="q-grade" style="padding:3px 10px;border-radius:100px;background:rgba(99,102,241,.15);color:#a5b4fc;font-size:.7rem;font-weight:800;"></span>
        <span id="q-unit" style="font-size:.7rem;color:#64748b;align-self:center;"></span>
      </div>
      <!-- 문제 -->
      <div class="question-text" id="q-text"></div>
      <!-- 선택지 -->
      <div class="choices" id="choices">
        <button class="choice-btn" style="display:none"></button>
        <button class="choice-btn" style="display:none"></button>
        <button class="choice-btn" style="display:none"></button>
        <button class="choice-btn" style="display:none"></button>
      </div>
      <!-- 피드백 -->
      <div id="q-feedback" class="q-feedback" style="display:none;padding:12px;border-radius:10px;font-weight:700;margin-top:10px;"></div>
      <button id="q-next-btn" class="start-btn" style="display:none;margin-top:10px;width:100%;">다음 문제 →</button>
    </div>

    <!-- 결과 화면 -->
    <div id="result-screen">
      <div class="result-emoji" id="result-emoji">🎉</div>
      <div class="result-score" id="result-grade" style="font-size:4rem;font-weight:900;"></div>
      <div class="result-sub" id="result-correct"></div>
      <div class="result-sub" id="result-streak"></div>
      <div class="result-sub" id="result-subject"></div>
      <div class="level-msg"  id="result-newgrade"></div>
      <div class="btn-row">
        <button class="start-btn" onclick="goSelect()">과목 다시 선택</button>
      </div>
    </div>

    <a class="back-link" href="index.html">← 학습 게임 허브로 돌아가기</a>
  </div>
</div>

<script>
'use strict';

// ── 과목 메타 (GameRegistry와 동기화) ────────────────────────
const SUBJECTS = [
  { key:'사회', icon:'🏛', desc:'국토, 역사, 정치, 경제, 세계 여러 나라' },
  { key:'과학', icon:'🔬', desc:'물질, 생물, 지구, 에너지, 실험' },
  { key:'국어', icon:'📖', desc:'어휘, 맞춤법, 속담, 관용어, 문법' },
  { key:'영어', icon:'🔤', desc:'어휘, 구동사, 문법, 표현' },
  { key:'수학', icon:'📐', desc:'사칙연산, 분수, 소수, 비율, 도형' },
];

let _quiz = null;     // 현재 QuizEngine 인스턴스
let _timerInt = null;
let _timeLeft = 30;
const GAME_ID = '지식탐험';

// ── 프로필 배지 ──────────────────────────────────────────────
function renderProfileBadge() {
  const user = LearningHub.getCurrentUser();
  SUBJECTS.forEach(s => {
    const el = document.querySelector(`.grade-badge[data-subject="${s.key}"]`);
    if (!el) return;
    if (!user) { el.style.display = 'none'; return; }
    el.style.display = 'inline-block';
    el.textContent = s.key + ' ' + LearningHub.gradeLabel(user.grades[s.key]);
  });
}

// ── 과목 선택 그리드 ─────────────────────────────────────────
function renderSubjectGrid() {
  const grid = document.getElementById('subject-grid');
  if (!grid) return;
  const user = LearningHub.getCurrentUser();
  grid.innerHTML = SUBJECTS.map(s => {
    const reviewN = user ? LearningHub.getReviewCount(GAME_ID, s.key) : 0;
    const grade   = user ? (user.grades[s.key] || 3) : 3;
    return `
      <button class="subject-btn" onclick="startQuiz('${s.key}')">
        <span class="subj-icon">${s.icon}</span>
        <span class="subj-name">${s.key}</span>
        <span class="subj-desc">${s.desc}</span>
        <span class="subj-grade">${LearningHub.gradeLabel(grade)}학년</span>
        ${reviewN > 0 ? `<span class="subj-review">📝 복습 ${reviewN}개</span>` : ''}
      </button>`;
  }).join('');
}

// ── 퀴즈 시작 (QuizEngine 사용) ─────────────────────────────
async function startQuiz(subject) {
  // 이전 타이머 정리
  clearInterval(_timerInt);
  // 이전 QuizEngine abort
  if (_quiz) { _quiz.abort(); _quiz = null; }

  showScreen('quiz-screen');

  _quiz = new QuizEngine({
    gameId:  GAME_ID,
    subject: subject,
    total:   15,

    onQuestion(q, idx, total) {
      // 진행바
      document.getElementById('q-progress-fill').style.width = (idx / total * 100) + '%';
      document.getElementById('q-num').textContent = `${idx + 1} / ${total}`;

      // 학년 배지
      const gradeEl = document.getElementById('q-grade');
      if (gradeEl) gradeEl.textContent = LearningHub.gradeLabel(q.grade || 3) + '학년';

      // 단원
      const unitEl = document.getElementById('q-unit');
      if (unitEl) unitEl.textContent = q.unit || '';

      // 문제 텍스트
      document.getElementById('q-text').textContent = q.q;

      // 선택지
      const btns = document.querySelectorAll('.choice-btn');
      btns.forEach((btn, i) => {
        btn.textContent = q.choices[i] || '';
        btn.className = 'choice-btn';
        btn.disabled = false;
        btn.onclick = () => _quiz.answer(i);
      });

      // 피드백 숨김
      document.getElementById('q-feedback').style.display = 'none';
      document.getElementById('q-next-btn').style.display = 'none';

      // 타이머
      _startTimer();
    },

    onResult(isCorrect, q, stats) {
      clearInterval(_timerInt);

      // 선택지 색상
      const btns = document.querySelectorAll('.choice-btn');
      btns.forEach((b, i) => {
        b.disabled = true;
        if (i === q.answer) b.classList.add('correct');
      });

      // 피드백
      const fb = document.getElementById('q-feedback');
      fb.textContent = isCorrect
        ? `✅ 정답! (${stats.streak > 1 ? stats.streak + '연속! 🔥' : ''})`
        : `❌ 오답! 정답: ${q.choices[q.answer]}`;
      fb.className = 'q-feedback ' + (isCorrect ? 'correct' : 'wrong');
      fb.style.display = 'block';

      // HUD
      document.getElementById('q-correct').textContent = stats.correct;
      document.getElementById('q-wrong').textContent   = stats.wrong;

      // 다음 버튼
      const nextBtn = document.getElementById('q-next-btn');
      nextBtn.style.display = 'block';
      nextBtn.onclick = () => _quiz.next();
    },

    onEnd(summary) {
      clearInterval(_timerInt);
      showResult(subject, summary);
    },
  });

  await _quiz.init();
  _quiz.start();
}

// ── 타이머 ───────────────────────────────────────────────────
function _startTimer() {
  _timeLeft = 30;
  _updateTimer();
  _timerInt = setInterval(() => {
    _timeLeft--;
    _updateTimer();
    if (_timeLeft <= 0) {
      clearInterval(_timerInt);
      // 시간 초과 → 오답 처리
      if (_quiz) _quiz.answer(-1);
    }
  }, 1000);
}

function _updateTimer() {
  const el = document.getElementById('q-timer');
  if (!el) return;
  el.textContent = _timeLeft;
  el.style.color = _timeLeft <= 5 ? '#ef4444' : _timeLeft <= 10 ? '#f59e0b' : '#60a5fa';
  const fill = document.getElementById('timer-fill');
  if (fill) fill.style.width = (_timeLeft / 30 * 100) + '%';
}

// ── 결과 화면 ────────────────────────────────────────────────
function showResult(subject, summary) {
  showScreen('result-screen');
  const { correct, total, acc, grade, bestStreak } = summary;

  document.getElementById('result-grade').textContent  = grade;
  document.getElementById('result-emoji').textContent  = { S:'🏆', A:'🥇', B:'🥈', C:'🥉', D:'😅' }[grade] || '🎮';
  document.getElementById('result-correct').textContent = `${correct} / ${total}문제 (${Math.round(acc*100)}%)`;
  document.getElementById('result-streak').textContent  = `최대 연속: ${bestStreak}`;
  document.getElementById('result-subject').textContent = `과목: ${subject}`;

  const newGrade = LearningHub.getGrade(subject);
  document.getElementById('result-newgrade').textContent = `현재 학년: ${LearningHub.gradeLabel(newGrade)}학년`;
}

// ── 화면 전환 ─────────────────────────────────────────────────
function showScreen(id) {
  ['select-screen','quiz-screen','result-screen'].forEach(s => {
    const el = document.getElementById(s);
    if (el) el.style.display = s === id ? 'block' : 'none';
  });
}

function goSelect() {
  if (_quiz) { _quiz.abort(); _quiz = null; }
  clearInterval(_timerInt);
  showScreen('select-screen');
  renderSubjectGrid();
  renderProfileBadge();
}

// ── 초기화 ───────────────────────────────────────────────────
GameInit.start(GAME_ID, () => {
  renderSubjectGrid();
  renderProfileBadge();
  showScreen('select-screen');

  // EventBus 구독
  if (typeof Bus !== 'undefined') {
    Bus.on('grade:changed', () => { renderSubjectGrid(); renderProfileBadge(); });
    Bus.on('user:login',    () => { renderSubjectGrid(); renderProfileBadge(); });
  }
});
</script>
</body>
</html>
