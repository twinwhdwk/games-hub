<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📔 성장 일지</title>
<script src="js/core/event-bus.js"></script>
<script src="js/core/container.js"></script>
<script src="js/core/store.js"></script>
<script src="js/core/user.js"></script>
<script src="js/core/items.js"></script>
<script src="js/ui/toast.js"></script>
<script src="js/ui/modal.js"></script>
<script src="js/game/data-loader.js"></script>
<script src="js/game/quiz-engine.js"></script>
<script src="js/game-registry.js"></script>
<script src="shared.js"></script>
<link rel="stylesheet" href="js/ui/theme.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: radial-gradient(ellipse at top, #1a2a4a 0%, #06070f 70%);
  color:#fff; font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  min-height:100vh; padding:20px;
}
#app { max-width:600px; margin:0 auto; }

.title {
  font-size: clamp(24px,6vw,32px); font-weight:900; text-align:center;
  background: linear-gradient(135deg,#00d4ff,#a855f7,#ffd166);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  margin-bottom:6px;
}
.subtitle { text-align:center; color:#8892a4; font-size:0.85rem; margin-bottom:20px; }

.section {
  background: rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08);
  border-radius:18px; padding:20px; margin-bottom:16px; backdrop-filter:blur(10px);
}
.section-title { font-size:1rem; font-weight:800; margin-bottom:14px; display:flex; align-items:center; gap:8px; }

/* 캐릭터 */
.char-row { display:flex; align-items:center; gap:18px; }
#char-canvas { width:96px; height:96px; image-rendering:pixelated; background:rgba(0,0,0,0.25); border-radius:14px; border:2px solid rgba(255,255,255,0.1); flex-shrink:0; }
.char-info { flex:1; }
.char-level { font-size:1.1rem; font-weight:900; margin-bottom:6px; }
.char-level .lv-num { color:#ffd700; font-size:1.3rem; }
.exp-bar-wrap { height:10px; background:rgba(255,255,255,0.08); border-radius:100px; overflow:hidden; margin-bottom:6px; }
.exp-bar-fill { height:100%; background:linear-gradient(90deg,#00d4ff,#a855f7); border-radius:100px; transition:width .4s; }
.exp-label { font-size:0.72rem; color:#8892a4; }

/* 과목별 학년 */
.subject-row { display:flex; align-items:center; gap:12px; margin-bottom:14px; }
.subject-row:last-child { margin-bottom:0; }
.subject-icon { font-size:1.6rem; width:32px; text-align:center; }
.subject-main { flex:1; }
.subject-name-row { display:flex; justify-content:space-between; font-size:0.85rem; font-weight:700; margin-bottom:6px; }
.subject-name-row .grade-val { color:#ffd700; }
.grade-track { display:flex; gap:4px; }
.grade-seg { flex:1; height:8px; border-radius:100px; background:rgba(255,255,255,0.08); }
.grade-seg.filled { background:linear-gradient(90deg,#00d4ff,#a855f7); }
.review-pill {
  font-size:0.68rem; color:#ffd166; background:rgba(255,209,102,0.12);
  border:1px solid rgba(255,209,102,0.35); border-radius:8px; padding:2px 8px; margin-left:8px; white-space:nowrap;
}

/* 게임 통계 */
.game-stat-row { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid rgba(255,255,255,0.05); }
.game-stat-row:last-child { border-bottom:none; }
.game-stat-icon { font-size:1.5rem; width:32px; text-align:center; }
.game-stat-info { flex:1; }
.game-stat-name { font-size:0.9rem; font-weight:700; }
.game-stat-sub { font-size:0.72rem; color:#8892a4; margin-top:2px; }
.game-stat-acc { font-size:1.1rem; font-weight:900; color:#4ade80; min-width:50px; text-align:right; }
.game-stat-acc.low { color:#ff9a76; }

.empty-msg { text-align:center; color:#5a6378; font-size:0.85rem; padding:20px 0; }

/* 학습현황 */
.status-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.status-card {
  background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.09);
  border-radius:12px; padding:14px; text-align:center;
}
.status-card .num { font-size:1.8rem; font-weight:900; color:#ffd32a; }
.status-card .label { font-size:0.72rem; color:#8892a4; margin-top:2px; }
.wrong-summary { margin-top:10px; }
.wrong-row {
  display:flex; justify-content:space-between; align-items:center;
  padding:8px 0; border-bottom:1px solid rgba(255,255,255,0.05);
  font-size:0.85rem;
}
.wrong-row:last-child { border-bottom:none; }
.wrong-badge {
  padding:2px 8px; border-radius:100px; font-size:0.7rem; font-weight:700;
}
.pending { background:rgba(255,107,107,0.15); color:#ff8a8a; }
.mastered { background:rgba(74,222,128,0.15); color:#4ade80; }

/* 최근 아이템 */
.items-row { display:flex; gap:10px; flex-wrap:wrap; }
.item-chip {
  display:inline-flex; align-items:center; gap:6px;
  background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1);
  border-radius:100px; padding:6px 12px; font-size:0.78rem; color:#c4cde0;
}
.item-chip.rarity-rare { border-color:#60a5fa44; }
.item-chip.rarity-epic { border-color:#a855f744; }
.item-chip.rarity-legendary { border-color:#fbbf2444; }

a.back-link { display:block; text-align:center; margin-top:14px; color:#8892a4; font-size:0.8rem; text-decoration:none; }
a.back-link:hover { color:#fff; }

#login-prompt { text-align:center; padding:40px 20px; }
#login-prompt .start-btn {
  display:inline-block; padding:14px 28px; border:none; border-radius:14px;
  background:linear-gradient(135deg,#00d4ff,#a855f7); color:#06070f; font-weight:900;
  font-size:1rem; cursor:pointer; margin-top:16px;
}
</style>
</head>
<body>

<div id="app">
  <div class="title">📔 성장 일지</div>
  <div class="subtitle">내 캐릭터와 학습 기록을 한눈에!</div>

  <div id="content" style="display:none;">
    <!-- 캐릭터 -->
    <div class="section">
      <div class="section-title" style="justify-content:space-between;">
        <span>🧙 내 캐릭터</span>
        <div style="display:flex;gap:8px;">
          <a href="캐릭터.html" style="font-size:.72rem;padding:4px 12px;border-radius:100px;background:rgba(99,102,241,.15);border:1px solid rgba(99,102,241,.3);color:#a5b4fc;text-decoration:none;font-weight:700;">🎨 꾸미기</a>
          <a href="베이스캠프.html" style="font-size:.72rem;padding:4px 12px;border-radius:100px;background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.25);color:#fbbf24;text-decoration:none;font-weight:700;">🏕️ 방</a>
        </div>
      </div>
      <div class="char-row">
        <canvas id="char-canvas" width="128" height="128"></canvas>
        <div class="char-info">
          <div class="char-level">Lv.<span class="lv-num" id="char-level">1</span> <span id="char-name"></span></div>
          <div class="exp-bar-wrap"><div class="exp-bar-fill" id="char-exp-fill" style="width:0%"></div></div>
          <div class="exp-label" id="char-exp-label">EXP 0 / 100</div>
          <div id="streak-info" style="margin-top:8px;font-size:0.78rem;color:#ffd32a;font-weight:700;"></div>
        </div>
      </div>
    </div>

    <!-- 연속 출석 + 오답노트 요약 -->
    <div class="section">
      <div class="section-title">📊 학습 현황</div>
      <div id="study-status"></div>
    </div>

    <!-- 과목별 학년 -->
    <div class="section">
      <div class="section-title">🎯 과목별 학습 레벨</div>
      <div id="subject-grades"></div>
    </div>

    <!-- 최근 해금 아이템 -->
    <div class="section" id="recent-items-section">
      <div class="section-title">🎁 최근 획득 아이템</div>
      <div id="recent-items"></div>
    </div>

    <!-- 게임별 통계 -->
    <div class="section">
      <div class="section-title">🎮 게임별 기록</div>
      <div id="game-stats"></div>
    </div>
  </div>

  <div id="login-prompt">
    <div style="font-size:1rem;color:#8892a4;">로그인하면 나만의 성장 일지를 볼 수 있어요!</div>
    <button class="start-btn" id="login-btn">로그인 / 프로필 만들기</button>
  </div>

  <a class="back-link" href="index.html">← 학습 게임 허브로 돌아가기</a>
</div>

<script>
const GAME_META = (typeof GameRegistry !== 'undefined')
  ? Object.fromEntries(GameRegistry.all().map(g => [g.id, { name:g.name, icon:g.icon, tier:g.tier, subjects:g.subjects }]))
  : {};

const SUBJECT_ICONS = { '수학':'📐', '영어':'🔤', '국어':'📖', '사회':'🏛', '과학':'🔬' };

function renderCharacter() {
  const c = LearningHub.getCharacter();
  const need = LearningHub.LEVEL_EXP(c.level);
  document.getElementById('char-level').textContent = c.level;
  document.getElementById('char-name').textContent = LearningHub.getCurrentUser().name;
  document.getElementById('char-exp-fill').style.width = Math.min(100, (c.exp / need) * 100) + '%';
  document.getElementById('char-exp-label').textContent = `EXP ${c.exp} / ${need}`;
  LearningHub.renderCurrentCharacter(document.getElementById('char-canvas'), 8);
}

function renderSubjectGrades() {
  const wrap = document.getElementById('subject-grades');
  wrap.innerHTML = '';
  const u = LearningHub.getCurrentUser();
  if (!u) return;
  const wrongSummary = LearningHub.getWrongBankSummary();
  const TIER_RANGES = [
    { label:'초등', min:3, max:6, color:'#2ecc71' },
    { label:'중등', min:7, max:9, color:'#3498db' },
    { label:'고등', min:10, max:12, color:'#9b59b6' },
  ];

  LearningHub.SUBJECTS.forEach(subject => {
    const grade   = u.grades[subject] || 3;
    const pending = (wrongSummary[subject] || {}).pending || 0;
    const tier    = LearningHub.getTier(grade);

    // 전체 진행도 (3~12 중 현재 위치)
    const totalRange = 12 - 3;
    const pct = Math.round(((grade - 3) / totalRange) * 100);

    const row = document.createElement('div');
    row.className = 'subject-row';
    row.innerHTML = `
      <div class="subject-icon">${SUBJECT_ICONS[subject] || '📘'}</div>
      <div class="subject-main">
        <div class="subject-name-row">
          <span>${subject}</span>
          <span class="grade-val">${LearningHub.gradeLabel(grade)}학년 <span style="font-size:.65rem;color:${TIER_RANGES.find(t=>t.label===({elementary:'초등',middle:'중등',high:'고등'}[tier]))?.color || '#fff'};opacity:.8;">(${{elementary:'초등',middle:'중등',high:'고등'}[tier]})</span>${pending > 0 ? `<span class="review-pill">📝 ${pending}</span>` : ''}</span>
        </div>
        <div style="margin-top:6px;">
          <div style="display:flex;gap:3px;margin-bottom:4px;">
            ${TIER_RANGES.map(tr => {
              const filled = grade >= tr.max ? tr.max - tr.min + 1 : grade >= tr.min ? grade - tr.min + 1 : 0;
              const total  = tr.max - tr.min + 1;
              return `<div style="flex:${total};display:flex;gap:2px;" title="${tr.label}">
                ${Array.from({length:total}, (_,i) => `<div style="flex:1;height:6px;border-radius:3px;background:${i < filled ? tr.color : 'rgba(255,255,255,.08)'}"></div>`).join('')}
              </div>`;
            }).join('')}
          </div>
          <div style="display:flex;justify-content:space-between;font-size:.6rem;color:#475569;">
            <span>초3</span><span>초6 │ 중1</span><span>중3 │ 고1</span><span>고3</span>
          </div>
        </div>
      </div>
    `;
    wrap.appendChild(row);
  });

  // 학습 분석 추가
  renderLearningAnalysis(u);
}

function renderLearningAnalysis(u) {
  let section = document.getElementById('analysis-section');
  if (!section) {
    section = document.createElement('div');
    section.id = 'analysis-section';
    section.className = 'section';
    section.style.marginTop = '14px';
    document.getElementById('subject-grades').after(section);
  }

  const allStats = LearningHub.getAllStats();
  const wrongSummary = LearningHub.getWrongBankSummary();

  // 총 플레이 횟수, 총 정답 수
  let totalPlays = 0, totalCorrect = 0, totalQ = 0;
  Object.values(allStats).forEach(s => { totalPlays += s.plays || 0; totalCorrect += s.totalCorrect || 0; totalQ += s.totalQ || 0; });
  const overallAcc = totalQ > 0 ? Math.round(totalCorrect / totalQ * 100) : 0;

  // 강점/약점 과목
  const subjAccs = LearningHub.SUBJECTS.map(s => {
    const ws = wrongSummary[s] || { total:0, mastered:0, pending:0 };
    const g = u.grades[s] || 3;
    return { s, g, pending: ws.pending, mastered: ws.mastered };
  });
  const strongest = subjAccs.reduce((a,b) => b.g > a.g ? b : a, subjAccs[0]);
  const weakest   = subjAccs.filter(x=>x.pending>0).reduce((a,b)=>b.pending>a.pending?b:a, { s:'없음', pending:0 });

  section.innerHTML = `
    <div class="section-title" style="margin-bottom:12px;">📊 학습 분석</div>
    <div class="status-grid" style="grid-template-columns:repeat(3,1fr);">
      <div class="status-card">
        <div class="num">${totalPlays}</div><div class="label">총 플레이</div>
      </div>
      <div class="status-card">
        <div class="num" style="color:#4ade80;">${overallAcc}%</div><div class="label">전체 정답률</div>
      </div>
      <div class="status-card">
        <div class="num" style="color:#ffd700;">${totalCorrect}</div><div class="label">누적 정답</div>
      </div>
    </div>
    <div style="margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px;">
      <div style="background:rgba(74,222,128,.07);border:1px solid rgba(74,222,128,.15);border-radius:12px;padding:12px;text-align:center;">
        <div style="font-size:.7rem;color:#4ade80;font-weight:700;margin-bottom:4px;">💪 가장 높은 학년</div>
        <div style="font-weight:900;color:#fff;">${strongest.s}</div>
        <div style="font-size:.75rem;color:#4ade80;">${LearningHub.gradeLabel(strongest.g)}학년</div>
      </div>
      <div style="background:rgba(248,113,113,.07);border:1px solid rgba(248,113,113,.15);border-radius:12px;padding:12px;text-align:center;">
        <div style="font-size:.7rem;color:#f87171;font-weight:700;margin-bottom:4px;">📝 오답 가장 많은 과목</div>
        <div style="font-weight:900;color:#fff;">${weakest.s}</div>
        <div style="font-size:.75rem;color:#f87171;">${weakest.pending > 0 ? weakest.pending + '문제 대기중' : '모두 클리어!'}</div>
      </div>
    </div>
  `;
}

function renderGameStats() {
  const wrap = document.getElementById('game-stats');
  wrap.innerHTML = '';
  const allStats = LearningHub.getAllStats();
  const games = typeof GameRegistry !== 'undefined' ? GameRegistry.all() : [];
  let hasAny = false;

  games.forEach(game => {
    const s = allStats[game.id];
    if (!s || s.plays === 0) return;
    hasAny = true;
    const accuracy = s.totalQ > 0 ? Math.round((s.totalCorrect / s.totalQ) * 100) : 0;
    const barColor = accuracy >= 80 ? '#22c55e' : accuracy >= 60 ? '#f59e0b' : '#ef4444';
    const tierColors = { elementary:'#2ecc71', middle:'#3498db', high:'#9b59b6' };
    const tc = tierColors[game.tier] || '#888';

    const row = document.createElement('div');
    row.className = 'game-stat-row';
    row.innerHTML = `
      <div class="game-stat-icon">${game.icon}</div>
      <div class="game-stat-info" style="flex:1;">
        <div class="game-stat-name" style="display:flex;align-items:center;gap:6px;">
          ${game.name}
          <span style="font-size:.62rem;padding:2px 6px;border-radius:100px;background:${tc}18;color:${tc};font-weight:700;">${{elementary:'초등',middle:'중등',high:'고등'}[game.tier]||''}</span>
        </div>
        <div class="game-stat-sub">${s.plays}회 · 정답 ${s.totalCorrect}/${s.totalQ}</div>
        <div style="margin-top:5px;background:rgba(255,255,255,.07);border-radius:100px;height:5px;overflow:hidden;">
          <div style="width:${accuracy}%;height:100%;background:${barColor};border-radius:100px;transition:width .5s;"></div>
        </div>
      </div>
      <div class="game-stat-acc ${accuracy < 60 ? 'low' : ''}" style="color:${barColor};">${accuracy}%</div>
    `;
    wrap.appendChild(row);
  });

  if (!hasAny) {
    wrap.innerHTML = '<div class="empty-msg">아직 플레이한 게임이 없어요. 게임을 시작해보세요! 🎮</div>';
    return;
  }

  // 과목별 정답률 바 차트 (Canvas)
  renderAccuracyChart(allStats);
}

function renderAccuracyChart(allStats) {
  let chartSection = document.getElementById('accuracy-chart-section');
  if (!chartSection) {
    chartSection = document.createElement('div');
    chartSection.id = 'accuracy-chart-section';
    chartSection.className = 'section';
    chartSection.style.marginTop = '14px';
    document.getElementById('game-stats').after(chartSection);
  }

  const SUBJECTS = ['수학','영어','국어','사회','과학'];
  const COLORS   = { 수학:'#f39c12', 영어:'#e74c3c', 국어:'#27ae60', 사회:'#2980b9', 과학:'#8e44ad' };

  // 과목별 정답률 계산 (오답노트 기반)
  const wrongSummary = LearningHub.getWrongBankSummary();
  const subjData = SUBJECTS.map(s => {
    const ws = wrongSummary[s] || { total:0, mastered:0, pending:0 };
    const total = ws.total || 0;
    const acc = total > 0 ? Math.round((ws.mastered / total) * 100) : 0;
    return { s, acc, color: COLORS[s], grade: LearningHub.getGrade(s) };
  }).filter(d => d.acc > 0 || d.grade > 3);

  if (!subjData.length) { chartSection.style.display = 'none'; return; }
  chartSection.style.display = 'block';

  chartSection.innerHTML = `
    <div class="section-title" style="margin-bottom:12px;">📈 과목별 숙달도</div>
    <div style="display:flex;flex-direction:column;gap:10px;">
      ${SUBJECTS.map(subj => {
        const ws = wrongSummary[subj] || { total:0, mastered:0, pending:0 };
        const total = ws.total;
        const acc = total > 0 ? Math.round(ws.mastered / total * 100) : 0;
        const grade = LearningHub.getGrade(subj);
        const tier = LearningHub.getTier(grade);
        const tierLabel = {elementary:'초',middle:'중',high:'고'}[tier] || '';
        const color = COLORS[subj];
        return `
          <div style="display:flex;align-items:center;gap:10px;">
            <div style="width:32px;text-align:right;font-size:.8rem;color:#94a3b8;">${subj}</div>
            <div style="flex:1;background:rgba(255,255,255,.07);border-radius:100px;height:10px;overflow:hidden;position:relative;">
              <div style="width:${acc}%;height:100%;background:${color};border-radius:100px;transition:width .6s cubic-bezier(.34,1.56,.64,1);"></div>
            </div>
            <div style="width:36px;text-align:right;font-size:.75rem;font-weight:700;color:${color};">${acc}%</div>
            <div style="font-size:.65rem;color:#64748b;white-space:nowrap;">${tierLabel}${grade<=6?grade:grade<=9?grade-6:grade-9}학년</div>
          </div>`;
      }).join('')}
    </div>
    <div style="font-size:.65rem;color:#475569;margin-top:8px;text-align:right;">오답 숙달 비율 기준</div>
  `;
}

function renderStudyStatus() {
  const u = LearningHub.getCurrentUser();
  const streak = u.streak || 1;
  const wrongSummary = LearningHub.getWrongBankSummary();
  let totalPending = 0, totalMastered = 0;
  Object.values(wrongSummary).forEach(s => { totalPending += s.pending; totalMastered += s.mastered; });

  // 스트릭 표시
  const streakEl = document.getElementById('streak-info');
  if (streakEl) {
    const next = streak < 7 ? 7 : streak < 14 ? 14 : streak < 30 ? 30 : null;
    streakEl.textContent = `🔥 ${streak}일 연속 접속${next ? ` (${next}일 달성 시 보상!)` : ' 🏆 최고 달성!'}`;
  }

  const wrap = document.getElementById('study-status');
  wrap.innerHTML = `
    <div class="status-grid">
      <div class="status-card">
        <div class="num">🔥 ${streak}</div>
        <div class="label">연속 접속일</div>
      </div>
      <div class="status-card">
        <div class="num" style="color:#ff8a8a;">${totalPending}</div>
        <div class="label">남은 오답 문제</div>
      </div>
    </div>
    ${totalPending > 0 ? `
    <div class="wrong-summary">
      ${LearningHub.SUBJECTS.map(s => {
        const info = wrongSummary[s] || {pending:0, mastered:0};
        if (info.pending === 0 && info.mastered === 0) return '';
        return `<div class="wrong-row">
          <span>${s}</span>
          <span>
            ${info.pending > 0 ? `<span class="wrong-badge pending">미숙달 ${info.pending}</span>` : ''}
            ${info.mastered > 0 ? `<span class="wrong-badge mastered">숙달 ${info.mastered}</span>` : ''}
          </span>
        </div>`;
      }).join('')}
      <div style="text-align:right;margin-top:8px;">
        <a href="오답노트.html" style="font-size:0.78rem;color:#7c7cff;font-weight:700;">📝 오답노트 풀기 →</a>
      </div>
    </div>` : '<div class="empty-msg">🎉 모든 오답을 마스터했어요!</div>'}
  `;
}

function renderRecentItems() {
  const c = LearningHub.getCharacter();
  if (!c) return;
  const section = document.getElementById('recent-items-section');
  const nonDefault = LearningHub.ITEM_CATALOG.filter(it =>
    it.unlock.type !== 'default' && c.inventory.includes(it.id)
  );

  if (!nonDefault.length) {
    section.style.display = 'none';
    return;
  }
  section.style.display = 'block';
  const wrap = document.getElementById('recent-items');
  const RARITY_COLOR = { common:'#888', rare:'#60a5fa', epic:'#a855f7', legendary:'#fbbf24' };
  wrap.innerHTML = nonDefault.slice(-8).reverse().map(item => {
    const col = RARITY_COLOR[item.rarity] || '#888';
    const RARITY_LABEL = { common:'일반', rare:'희귀', epic:'에픽', legendary:'전설' };
    const unlockDesc = LearningHub.describeUnlock(item);
    return `
      <div style="display:flex;align-items:center;gap:10px;padding:8px 10px;
        background:rgba(255,255,255,.04);border-radius:10px;border:1px solid rgba(255,255,255,.06);
        margin-bottom:6px;">
        <div style="width:8px;height:8px;border-radius:50%;background:${col};flex-shrink:0;box-shadow:0 0 6px ${col};"></div>
        <div style="flex:1;min-width:0;">
          <div style="font-size:.82rem;font-weight:700;color:#fff;">${item.name}</div>
          <div style="font-size:.65rem;color:#64748b;">${RARITY_LABEL[item.rarity]||''} · ${unlockDesc}</div>
        </div>
        <div style="font-size:.68rem;padding:2px 8px;border-radius:100px;
          background:${col}18;color:${col};font-weight:700;border:1px solid ${col}33;">
          ${item.slot === 'hair' ? '헤어' : item.slot === 'outfit' ? '의상' : item.slot === 'hat' ? '모자' :
            item.slot === 'weapon' ? '무기' : item.slot === 'pet' ? '펫' : item.slot === 'body' ? '바디' : item.slot}
        </div>
      </div>`;
  }).join('');

  // 미해금 아이템 미리보기 (다음 해금 가능 아이템)
  const nextItems = LearningHub.ITEM_CATALOG.filter(it =>
    it.unlock.type !== 'default' && !c.inventory.includes(it.id) &&
    (it.unlock.type === 'level' && it.unlock.value === c.level + 1)
  ).slice(0, 2);

  if (nextItems.length) {
    wrap.innerHTML += `<div style="margin-top:10px;padding:10px 12px;background:rgba(99,102,241,.06);
      border:1px solid rgba(99,102,241,.15);border-radius:10px;">
      <div style="font-size:.72rem;color:#818cf8;font-weight:700;margin-bottom:6px;">✨ 다음 레벨업 시 해금</div>
      ${nextItems.map(it => `<div style="font-size:.8rem;color:#c4cde0;font-weight:700;">🔒 ${it.name}</div>`).join('')}
    </div>`;
  }
}

function renderAll() {
  if (!LearningHub.getCurrentUser()) {
    document.getElementById('content').style.display = 'none';
    document.getElementById('login-prompt').style.display = 'block';
    return;
  }
  document.getElementById('content').style.display = 'block';
  document.getElementById('login-prompt').style.display = 'none';
  renderCharacter();
  renderStudyStatus();
  renderSubjectGrades();
  renderRecentItems();
  renderGameStats();
}

document.getElementById('login-btn')?.addEventListener('click', () => {
  Modal.requireLogin(() => renderAll());
});

GameInit.start('성장일지', () => {
  renderAll();

  // EventBus 실시간 구독
  if (typeof Bus !== 'undefined') {
    Bus.on('level:up',      () => { renderCharacter(); renderRecentItems(); });
    Bus.on('grade:changed', () => { renderSubjectGrades(); renderStudyStatus(); });
    Bus.on('streak:updated',() => renderStudyStatus());
    Bus.on('item:unlocked', () => { renderCharacter(); renderRecentItems(); });
    Bus.on('user:login',    () => renderAll());
    Bus.on('user:logout',   () => renderAll());
    Bus.on('game:finished',    () => { renderGameStats(); renderStudyStatus(); });
    Bus.on('answer:recorded',  () => { renderStudyStatus(); });
    Bus.on('wrong:mastered',   () => { renderStudyStatus(); });
    Bus.on('exp:gained',       () => { renderCharacter(); });
  }
}, { backLink: true, requireLogin: false, checkStreak: true });
</script>
</body>
</html>
